apiVersion: v1
kind: Pod
metadata:
  name: pv-test-pod
  namespace: microservices
spec:
  containers:
    - name: storage-test
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Hello from Persistent Volume' > /data/test.txt && sleep 36000"]
      volumeMounts:
        - name: persistent-storage
          mountPath: /data
  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: pv-demo-claim
