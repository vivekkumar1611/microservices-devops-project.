apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: microservices-local-cert
  namespace: microservices
spec:
  secretName: microservices-tls
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
  dnsNames:
    - microservices.local
